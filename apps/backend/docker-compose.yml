version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: directref_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: directref
      POSTGRES_PASSWORD: directref_pass
      POSTGRES_DB: directref_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directref -d directref_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for the vitest integration suite. Separate port (5433)
  # and tmpfs storage so it can never touch dev data and never survives a
  # restart — `npm run test:db:up` then `npm test`.
  postgres-test:
    image: postgres:16-alpine
    container_name: directref_postgres_test
    environment:
      POSTGRES_USER: directref
      POSTGRES_PASSWORD: directref_pass
      POSTGRES_DB: directref_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directref -d directref_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer:latest
    container_name: directref_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
