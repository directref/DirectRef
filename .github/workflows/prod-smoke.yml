name: Production smoke

# Runs after a push to main has had time to deploy, and answers the question a
# green build does not: is the commit I just pushed actually the one serving
# traffic, and does the live site still work?
#
# During the 2026-09-16 repo cutover this took a human reading a dashboard
# three times, because /health returned a cheerful 200 from the OLD build every
# time. Both apps now report their commit, so it can be asserted instead.
#
# SAFE AGAINST PRODUCTION by construction, which is not the same as read-only.
# Two tags run here:
#   @readonly  — reads and asserts, changes nothing.
#   @prodsafe  — WRITES, but only ever as a test account: a `.test` address,
#                which the backend marks automatically; its postings are
#                excluded from the landing page, search and suggestions, no
#                mail can be sent to it, and everything is deleted in a
#                finally block. That is what lets the one thing the product
#                must be able to do — send a C.V. — be checked on the real
#                deployment rather than only in a disposable environment.
# Anything not carrying one of those tags never runs against production.
on:
  push:
    branches: [main]
    # Only when something deployable changed. A docs- or workflow-only commit
    # deploys nothing, so there would be no new SHA to wait for.
    paths:
      - 'apps/**'
  workflow_dispatch:

concurrency:
  group: prod-smoke
  cancel-in-progress: false # never cancel a deploy verification half-way

env:
  WEB: https://direct-ref.com
  API: https://api.direct-ref.com

jobs:
  changes:
    name: Which halves will deploy
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/frontend/**'

  wait_for_deploy:
    name: Wait for the deploy
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.wait.outputs.commit }}
      landed: ${{ steps.wait.outputs.landed }}
    steps:
      # Wait only for the halves that will actually redeploy.
      #
      # This mirrors the deploy config deliberately: Railway watches
      # apps/backend/**, and Vercel is set to skip when nothing under its root
      # directory changed. So a backend-only push leaves the frontend serving
      # its previous commit — correctly — and waiting for it would hang until
      # the job timed out. Getting this wrong makes the smoke job cry wolf on
      # most pushes, which is how teams learn to ignore it.
      #
      # A timeout here is deliberately NOT a job failure (see below) — it is
      # its own job specifically so that outcome can never fail this
      # workflow's check suite. 2026-09-24: Railway's "Wait for CI" reads
      # ALL check suites for the commit, this workflow's included, and blocks
      # the deploy until they are green. A deploy that is merely slow to
      # report here looked identical to a genuinely broken one — both ended
      # this job in failure — so the suite could never go green until the
      # deploy it was blocking had already landed. Circular, and it stayed
      # stuck for two days before anyone noticed. Ambiguous timing must
      # resolve to "we don't know yet", never to "broken" — the same
      # judgment call checkJobLiveness (apps/backend/src/services/jobScraper.ts)
      # makes for a careers page that fails to load.
      - name: Wait for the deploying halves to report this commit
        id: wait
        env:
          EXPECT_API: ${{ needs.changes.outputs.backend }}
          EXPECT_WEB: ${{ needs.changes.outputs.frontend }}
        run: |
          WANT="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "Want $WANT · backend deploying=$EXPECT_API · frontend deploying=$EXPECT_WEB"

          for i in $(seq 1 60); do
            API_SHA=$(curl -fsS --max-time 10 "$API/health"      2>/dev/null | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            WEB_SHA=$(curl -fsS --max-time 10 "$WEB/api/version" 2>/dev/null | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)

            API_OK=true; WEB_OK=true
            [ "$EXPECT_API" = "true" ] && [ "$API_SHA" != "$WANT" ] && API_OK=false
            [ "$EXPECT_WEB" = "true" ] && [ "$WEB_SHA" != "$WANT" ] && WEB_OK=false

            echo "  [$i] api=${API_SHA:-unreachable} web=${WEB_SHA:-unreachable}"
            if [ "$API_OK" = true ] && [ "$WEB_OK" = true ]; then
              echo "Deployed halves are live on $WANT"
              echo "commit=$WANT" >> "$GITHUB_OUTPUT"
              echo "landed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done

          echo "::warning::$WANT never reached production within 15 minutes (api=${API_SHA:-unreachable}, web=${WEB_SHA:-unreachable}). Not treated as a failure by itself — a slow deploy must never be able to block the deploy that would fix it. Check the Vercel and Railway deploy logs; re-run this workflow once it has landed."
          echo "landed=false" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke against production
    needs: [changes, wait_for_deploy]
    if: needs.wait_for_deploy.outputs.landed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install
        run: npm ci --prefix e2e

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # E2E_EXPECTED_COMMIT is only passed when BOTH halves were expected to
      # move to it — the api-contract spec asserts both endpoints against it,
      # and on a one-sided deploy the other half legitimately reports its own
      # older commit.
      # @readonly reads; @prodsafe also WRITES, but only ever as a test account:
      # `.test` addresses, postings excluded from every listing, no mail
      # possible, and everything deleted in a finally block. That is what lets
      # the one thing the product must do — send a C.V. — be checked here
      # rather than only in a disposable environment.
      - name: Smoke against production
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ env.WEB }}
          E2E_API_URL: ${{ env.API }}
          E2E_EXPECTED_COMMIT: ${{ (needs.changes.outputs.backend == 'true' && needs.changes.outputs.frontend == 'true') && needs.wait_for_deploy.outputs.commit || '' }}
          # Only needed while the pre-beta basic-auth gate is up. Absent is
          # fine now that SITE_PASSWORD is gone from Vercel.
          E2E_SITE_PASSWORD: ${{ secrets.E2E_SITE_PASSWORD }}
        run: npx playwright test --grep "@readonly|@prodsafe" --grep-invert "@known-issue"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report
          path: e2e/playwright-report/
          retention-days: 30
